[package]
name = "bashcut-batch"
description = "BashCutPro batch runner: parallel headless pipelines through the engine (bashcutpro, else filmcraft-cli), one project per input, resumable job book"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# A stand-in for filmcraft-cli that the integration tests drive (tests/batch.rs); never shipped.
[[bin]]
name = "bashcut-batch-fake-cli"
path = "tests/support/fake_cli.rs"
test = false
doc = false

[dependencies]
bashcut-dirs = { path = "../bashcut-dirs" }
serde = { workspace = true }
serde_json = { workspace = true }
