[package]
name = "bashcut-dirs"
description = "BashCutPro data folder: its own per-user folder next to FilmCraft's, portable installs, one-time import"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
log = { workspace = true }

# SIGINT / SIGTERM cleanups (`signal`, AG1); the same crate as bashcut-batch's Ctrl+C (MIT OR Apache-2.0)
[target.'cfg(unix)'.dependencies]
ctrlc = { version = "3.4", features = ["termination"] }

# the session token of the control channel (SY2); wasm has no channel and no randomness source here
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
