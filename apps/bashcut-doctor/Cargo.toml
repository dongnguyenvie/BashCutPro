[package]
name = "bashcut-doctor"
description = "BashCutPro doctor: setup checks before a run, update notices"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "bashcut-doctor"
path = "src/main.rs"

[dependencies]
bashcut-dirs = { path = "../../crates/bashcut-dirs" }
bashcut-manifest = { path = "../../crates/bashcut-manifest" }
serde_json = { workspace = true }
sha2 = "0.10"
