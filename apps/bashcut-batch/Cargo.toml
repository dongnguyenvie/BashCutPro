[package]
name = "bashcut-batch-cli"
description = "bashcut-batch: run, watch, retry, cancel and resume BashCutPro batch pipelines"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "bashcut-batch"
path = "src/main.rs"

[dependencies]
bashcut-batch = { path = "../../crates/bashcut-batch" }
bashcut-dirs = { path = "../../crates/bashcut-dirs" }
serde_json = { workspace = true }
# Ctrl+C asks the running job to cancel, so its steps (in their own process groups) are stopped
ctrlc = "3.4"

# the icon and VERSIONINFO of the Windows exe (build.rs, PK4)
[build-dependencies]
bashcut-winres = { path = "../../crates/bashcut-winres" }
